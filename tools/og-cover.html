<style>
  @font-face { font-family: "Roboto Mono"; src: url("../assets/fonts/roboto-mono-latin-wght.woff2") format("woff2"); font-weight: 100 700; }
  @font-face { font-family: "Roboto"; src: url("../assets/fonts/roboto-latin-wght.woff2") format("woff2"); font-weight: 100 900; }
  :root { --bg: #0d1220; --text: #e8edf5; --muted: #9aa7bd; --accent: #6f9bff; --border: #28324a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: "Roboto", sans-serif; color: var(--text);
    background:
      radial-gradient(520px 420px at 86% 50%, color-mix(in srgb, var(--accent) 16%, var(--bg)), transparent 70%),
      radial-gradient(700px 500px at 0% 0%, color-mix(in srgb, var(--accent) 7%, var(--bg)), transparent 70%),
      var(--bg);
  }
  /* faint grid, like a lab notebook */
  body::before {
    content: ""; position: absolute; inset: 0; opacity: .35;
    background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px; -webkit-mask-image: linear-gradient(90deg, #000, transparent 75%); mask-image: linear-gradient(90deg, #000, transparent 75%);
  }
  .text { position: absolute; left: 76px; top: 70px; width: 690px; }
  .mark { width: 168px; height: auto; display: block; margin-bottom: 44px; overflow: visible; }
  .eyebrow { margin: 0 0 14px; font-family: "Roboto Mono", monospace; font-weight: 600; font-size: 22px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 0; font-family: "Roboto Mono", monospace; font-weight: 700; font-size: 62px; line-height: 1.08; letter-spacing: -.035em; }
  .role { margin: 22px 0 0; font-size: 27px; line-height: 1.4; color: var(--muted); }
  .url {
    position: absolute; left: 76px; bottom: 58px; margin: 0;
    font-family: "Roboto Mono", monospace; font-weight: 600; font-size: 22px; color: var(--text);
    display: flex; align-items: center; gap: 14px;
  }
  .url span { color: var(--muted); font-weight: 500; }
  .photo {
    position: absolute; right: 84px; top: 50%; transform: translateY(-50%);
    width: 296px; height: 296px; border-radius: 28px; overflow: hidden;
    border: 2px solid color-mix(in srgb, var(--accent) 45%, var(--border));
    box-shadow: 0 30px 60px rgba(0, 0, 0, .45), 0 0 0 10px color-mix(in srgb, var(--accent) 8%, transparent);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* the splash's "ecs" mark, in its finished state */
  .m-depth use { fill: color-mix(in srgb, #03060f calc(var(--i) * 6%), color-mix(in srgb, var(--accent) 47%, #0a1633)); stroke: color-mix(in srgb, #03060f calc(var(--i) * 6%), color-mix(in srgb, var(--accent) 47%, #0a1633)); stroke-width: 1.4; transform: translate(calc(var(--i) * 1.05px), calc(var(--i) * 1.15px)); }
  .m-hi { stop-color: color-mix(in srgb, var(--accent) 58%, #fff); }
  .m-lo { stop-color: color-mix(in srgb, var(--accent) 80%, #0a1633); }
</style>
